name: Build & Publish WordPress Plugin Release ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (ví dụ: v1.0, v1.1)'
        required: false
        default: 'v1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Release Asset (hiep-si-toan-hoc-plugin.zip)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Standalone index.html & WordPress Plugin Release ZIP
        run: |
          python3 scripts/build_single_html.py
          python3 scripts/build_wp_zip.py
          ls -lh hiep-si-toan-hoc-plugin.zip

      - name: Create GitHub Release & Upload Plugin ZIP Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name != 'master' && github.ref_name || inputs.tag_name || 'v1.0' }}
          name: "Hiệp Sĩ Toán Học: Giải Cứu Rừng Pha Lê (${{ github.ref_name != 'main' && github.ref_name != 'master' && github.ref_name || inputs.tag_name || 'v1.0' }})"
          generate_release_notes: true
          files: |
            hiep-si-toan-hoc-plugin.zip
            index.html
